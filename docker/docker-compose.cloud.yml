name: erp-flow-cloud

x-cloud-logging: &cloud-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    container_name: !reset null
    logging: *cloud-logging
    ports: !reset []
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements,pgcrypto,pg_net,pgsodium
      - -c
      - cron.launch_active_jobs=off

  rest:
    container_name: !reset null
    image: postgrest/postgrest:v14.12
    logging: *cloud-logging
    ports: !reset []
    environment:
      PGRST_ADMIN_SERVER_PORT: 3001
    healthcheck:
      test: ["CMD-SHELL", "PGRST_SERVER_HOST=localhost postgrest --ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    container_name: !reset null
    logging: *cloud-logging
    ports: !reset []
    environment:
      GOTRUE_SITE_URL: ${APP_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECT_ALLOW_LIST:-}
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback

  storage:
    container_name: !reset null
    image: supabase/storage-api:v1.60.4
    logging: *cloud-logging
    ports: !reset []
    environment:
      AUTH_JWT_SECRET: ${JWT_SECRET}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  realtime:
    container_name: !reset null
    image: supabase/realtime:v2.102.3
    logging: *cloud-logging
    ports: !reset []
    environment:
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      METRICS_JWT_SECRET: ${JWT_SECRET}
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  functions:
    container_name: !reset null
    image: supabase/edge-runtime:v1.74.0
    logging: *cloud-logging
    environment:
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT:-false}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      ALLOWED_ORIGINS: ${APP_PUBLIC_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      PUBLIC_APP_URL: ${APP_PUBLIC_URL}
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-disabled}
      SAP_DEFAULT_BASE_URL: ${SAP_DEFAULT_BASE_URL:-}
      SAP_MIDDLEWARE_SECRET: ${SAP_MIDDLEWARE_SECRET:-}
      SAP_CRED_ENC_KEY: ${SAP_CRED_ENC_KEY:-}
      SAP_FALLBACK_ADMIN_USERNAME: ${SAP_FALLBACK_ADMIN_USERNAME:-}
      SAP_FALLBACK_ADMIN_PASSWORD: ${SAP_FALLBACK_ADMIN_PASSWORD:-}
      PAGCORP_API_KEY: ${PAGCORP_API_KEY:-}
      OMIE_APP_KEY: ${OMIE_APP_KEY:-}
      OMIE_APP_SECRET: ${OMIE_APP_SECRET:-}
      JUMPCLOUD_API_KEY: ${JUMPCLOUD_API_KEY:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EXTERNAL_APPROVALS_API_KEY: ${EXTERNAL_APPROVALS_API_KEY:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WHATSAPP_URL: ${WHATSAPP_URL:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-sa-east-1}
      AWS_S3_BACKUP_BUCKET: ${AWS_S3_BACKUP_BUCKET:-}
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
      - cloud-deno-cache:/root/.cache/deno
    command: ["start", "--main-service", "/home/deno/functions/main"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10

  scheduler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      ANON_KEY: ${ANON_KEY}
    command:
      - /bin/sh
      - -c
      - |-
        while true; do
          curl --fail --silent --show-error \
            -X POST \
            -H "apikey: $${ANON_KEY}" \
            -H "x-cron-secret: $${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            http://kong:8000/functions/v1/synapse-dispatcher || true
          sleep 60;
        done
    depends_on:
      kong:
        condition: service_healthy
      functions:
        condition: service_healthy
    networks: [internal]
    logging: *cloud-logging

  kong:
    container_name: !reset null
    logging: *cloud-logging
    ports: !reset []
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  studio:
    container_name: !reset null
    profiles: ["admin"]
    logging: *cloud-logging
    ports: !reset []

  meta:
    container_name: !reset null
    profiles: ["admin"]
    logging: *cloud-logging

  web:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-erp-flow-cloud}
        VITE_ENABLE_FAKE_AUTH: "false"
        VITE_FAKE_AUTH_EMAIL: ""
        VITE_FAKE_AUTH_PASSWORD: ""
        VITE_FAKE_AUTH_IS_ADMIN: "false"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks: [ingress]
    logging: *cloud-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "${CLOUD_HTTP_PORT:-80}:80"
      - "${CLOUD_HTTPS_PORT:-443}:443"
      - "${CLOUD_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cloud-caddy-data:/data
      - cloud-caddy-config:/config
    networks: [ingress]
    depends_on:
      web:
        condition: service_healthy
      kong:
        condition: service_healthy
    logging: *cloud-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: false

volumes:
  cloud-caddy-data:
  cloud-caddy-config:
  cloud-deno-cache:
