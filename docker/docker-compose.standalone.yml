name: erp-flow-standalone

services:
  db:
    image: supabase/postgres:15.6.1.146
    container_name: erp-standalone-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - standalone-db-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_cron,pg_stat_statements,pgcrypto,pg_net,pgsodium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: erp-standalone-rest
    restart: unless-stopped
    ports:
      - "127.0.0.1:54321:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  auth:
    image: supabase/gotrue:v2.164.0
    container_name: erp-standalone-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:8080
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:8080,http://localhost:8080
      API_EXTERNAL_URL: http://127.0.0.1:8000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  kong:
    image: kong:3.4
    container_name: erp-standalone-kong
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - rest
      - auth
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors
    volumes:
      - ./kong.standalone.yml:/var/lib/kong/kong.yml:ro

  web:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_FAKE_AUTH_EMAIL: ${VITE_FAKE_AUTH_EMAIL}
        VITE_FAKE_AUTH_PASSWORD: ${VITE_FAKE_AUTH_PASSWORD}
        VITE_FAKE_AUTH_IS_ADMIN: ${VITE_FAKE_AUTH_IS_ADMIN}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - kong
    restart: unless-stopped

volumes:
  standalone-db-data:
